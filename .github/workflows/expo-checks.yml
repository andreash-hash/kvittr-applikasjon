name: Expo checks + web e2e

on:
  pull_request:
    paths: ['expo-app/**', '.github/workflows/expo-checks.yml']
  push:
    branches: [main]
    paths: ['expo-app/**']
  workflow_dispatch:

concurrency:
  group: expo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest   # cheap: 1x minute multiplier
    timeout-minutes: 25
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Web e2e (mocked Supabase)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            expo-app/playwright-report
            expo-app/test-results
          retention-days: 7
